name: 构建并推送容器镜像

on:
  push:
    branches:
      - "**"
    tags:
      - "**"

# 版本号由开发者在提交前手动递增根目录 VERSION 文件，CI 只做校验和使用，不再自动递增并回推提交
permissions:
  contents: read
  packages: write

env:
  # 生产镜像以 Docker Hub 为准：国内宿主机直连 ghcr.io 会反复超时重试，
  # 拉不下来（2026-11-15 栈 103 部署即因此失败）。Docker Hub 走宿主机镜像
  # 加速器可以稳定拉取。ghcr 继续同步推送，保留给 GitHub 一侧的既有引用。
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/aiferry

jobs:
  container:
    # 隔离验收分支仅由cluster-test.yml构建，绝不覆盖正式版本/latest。
    if: "!startsWith(github.ref, 'refs/heads/cluster-test/') && !contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    environment: pro
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 后端测试
        run: go test ./...

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 前端测试
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run test:run

      - name: 读取版本
        id: version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION 格式无效：$version" >&2
            exit 1
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: 校验镜像仓库配置
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          # 变量名在仓库 Settings -> Variables 里配置，Token 放在 Secrets，
          # 缺任意一项都不要走到构建阶段才发现推不上去。
          if [[ -z "$DOCKERHUB_USERNAME" ]]; then
            echo "缺少仓库变量 DOCKERHUB_USERNAME，无法推送到 Docker Hub" >&2
            exit 1
          fi

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成镜像标签和元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=${{ steps.version.outputs.value }},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
