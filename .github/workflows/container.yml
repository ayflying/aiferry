name: 构建并推送容器镜像

on:
  push:
    branches:
      - "**"
    tags:
      - "**"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  container:
    runs-on: ubuntu-latest
    environment: pro
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 后端测试
        run: go test ./...

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 前端测试
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run test:run

      - name: 读取版本
        id: version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION 格式无效：$version" >&2
            exit 1
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签和元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=${{ steps.version.outputs.value }},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: 安装部署依赖
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends curl jq

      - name: 通过 Portainer 触发线上部署
        if: github.ref == 'refs/heads/main'
        env:
          PORTAINER_URL_SECRET: ${{ secrets.PORTAINER_URL }}
          PORTAINER_URL_VAR: ${{ vars.PORTAINER_URL }}
          PORTAINER_KEY_SECRET: ${{ secrets.PORTAINER_KEY }}
          PORTAINER_KEY_VAR: ${{ vars.PORTAINER_KEY }}
          ENDPOINT_NAME_SECRET: ${{ secrets.ENDPOINT_NAME }}
          ENDPOINT_NAME_VAR: ${{ vars.ENDPOINT_NAME }}
          STACK_NAME_SECRET: ${{ secrets.STACK_NAME }}
          STACK_NAME_VAR: ${{ vars.STACK_NAME }}
        run: |
          PORTAINER_URL="${PORTAINER_URL_SECRET:-${PORTAINER_URL_VAR}}"
          PORTAINER_KEY="${PORTAINER_KEY_SECRET:-${PORTAINER_KEY_VAR}}"
          ENDPOINT_NAME="${ENDPOINT_NAME_SECRET:-${ENDPOINT_NAME_VAR:-yunloli}}"
          STACK_NAME="${STACK_NAME_SECRET:-${STACK_NAME_VAR:-aiferry}}"
          # 未配置 Portainer 凭据时仅完成构建推送，不阻塞流水线。
          if [ -z "${PORTAINER_URL}" ] || [ -z "${PORTAINER_KEY}" ]; then
            echo "未配置 PORTAINER_URL / PORTAINER_KEY，跳过自动部署（仅构建推送镜像）"
            exit 0
          fi
          export PORTAINER_URL PORTAINER_KEY ENDPOINT_NAME STACK_NAME
          sh hack/deploy-portainer.sh
